name: Monitor treno Sri Lanka

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Invia un WhatsApp"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Controlla il calendario
        env:
          CALLMEBOT_PHONE: '+393396992631'
          CALLMEBOT_APIKEY: '8570211'
          TARGET_DATE: '2026-10-27'
          FROM_STATION: ${{ vars.FROM_STATION || 'Nanu Oya' }}
          TO_STATION: ${{ vars.TO_STATION || 'Ella' }}
          TEST_FLAG: ${{ inputs.test_notify && '--test-notify' || '' }}
        run: python monitor.py "$TARGET_DATE" --from "$FROM_STATION" --to "$TO_STATION" --notify $TEST_FLAG

      - name: Salva stato
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "Aggiorna stato monitor" && git push)

      - name: Screenshot di debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
